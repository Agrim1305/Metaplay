<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/landing.css">
  <script type="module">
    // Already signed in? Skip the form.
    fetch('/get-user', { credentials: 'same-origin' }).then((r) => { if (r.ok) location.replace('/pages/dashboard.html'); }).catch(() => {});

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = form.querySelector('button');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = form.elements.username.value.trim();
      const password = form.elements.password.value;
      if (!username || !password) {
        msg.textContent = 'Enter your username and password.';
        (username ? form.elements.password : form.elements.username).focus();
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      msg.textContent = '';
      try {
        const res = await fetch('/auth', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) { location.replace('/pages/dashboard.html'); return; }
        const data = await res.json().catch(() => ({}));
        msg.textContent = data.error || 'Invalid username or password.';
      } catch {
        msg.textContent = 'Server error. Please try again in a moment.';
      }
      btn.disabled = false;
      btn.textContent = 'Sign in';
    });
  </script>
</head>
<body>
  <header class="l-head">
    <a class="l-brand" href="/" aria-label="MetaPlay home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="logo-body" d="M5.8 2.5H16.4L19 5.1V21.2L12 16.6L5 21.2V3.3C5 2.9 5.4 2.5 5.8 2.5Z"/><rect class="logo-label" x="7.6" y="5.4" width="8.8" height="6.2" rx="0.7"/><rect class="logo-grip" x="7.6" y="13" width="8.8" height="0.9"/></svg>
      <span>MetaPlay</span>
    </a>
    <nav class="l-nav" aria-label="Account"><a class="l-cta" href="/pages/registration.html">Create account</a></nav>
  </header>
  <main class="a-main">
    <div class="a-card">
      <h1>Welcome back</h1>
      <p class="a-sub">Your shelves, scores and friends are where you left them.</p>
      <form class="a-form" id="form" novalidate>
        <label class="a-field">Username
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label class="a-field">Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="a-msg" id="msg" role="alert"></p>
        <button type="submit" class="l-cta">Sign in</button>
      </form>
      <div class="a-or">OR</div>
      <a class="l-google l-light" href="/auth/google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>
        Continue with Google
      </a>
      <p class="a-alt">New here? <a href="/pages/registration.html">Create an account</a></p>
    </div>
  </main>
</body>
</html>
