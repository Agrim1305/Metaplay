<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body data-page="admin">
  <main class="page admin">
    <div class="sec-head"><h1 class="page-title">Users</h1><span class="aside" id="user-count"></span></div>
    <div id="userTable" class="table-wrap" aria-busy="true"></div>
  </main>

  <dialog class="dlg" id="confirmModal" aria-labelledby="confirmText">
    <h2 id="confirmText">Are you sure?</h2>
    <p class="muted small">This permanently deletes the account and everything it owns.</p>
    <div class="dlg-actions">
      <button type="button" id="confirmCancel" class="btn btn-secondary">Cancel</button>
      <button type="button" id="confirmOk" class="btn btn-primary">Delete user</button>
    </div>
  </dialog>

  <dialog class="dlg" id="editModal" aria-labelledby="editTitle">
    <h2 id="editTitle">Edit user</h2>
    <form id="editForm" class="stack">
      <input type="hidden" id="editUserId">
      <input type="hidden" id="editOriginalRole">
      <label class="field">Username<input class="input" type="text" id="editUsername" required></label>
      <label class="field">Email<input class="input" type="email" id="editEmail" required></label>
      <label class="field">Bio<textarea class="input" id="editBio" rows="3"></textarea></label>
      <label class="field">Role
        <select class="input" id="editRole" required style="height:40px;font-size:15px;width:100%">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </label>
      <div class="dlg-actions">
        <button type="button" id="editCancel" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="editSave" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
