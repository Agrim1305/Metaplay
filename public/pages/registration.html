<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/landing.css">
  <script type="module">
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = form.querySelector('button');
    const f = form.elements;
    const post = (url, body) => fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'a-msg';
      const username = f.username.value.trim();
      const email = f.email.value.trim().toLowerCase();
      const password = f.password.value;
      if (!username || !email || !password) { msg.textContent = 'Username, email and password are required.'; return; }
      if (!f.email.checkValidity()) { msg.textContent = 'That email address doesn’t look right.'; f.email.focus(); return; }
      if (password.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; f.password.focus(); return; }
      btn.disabled = true;
      btn.textContent = 'Creating your shelf…';
      msg.textContent = '';
      try {
        const res = await post('/signup', { username, email, password, bio: f.bio.value.trim() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Registration failed.');
        // Sign straight in rather than making people type it all again.
        const login = await post('/auth', { username, password });
        location.replace(login.ok ? '/pages/dashboard.html' : '/pages/login.html');
        return;
      } catch (err) {
        msg.textContent = err.message === 'Failed to fetch' ? 'Server error. Please try again in a moment.' : err.message;
      }
      btn.disabled = false;
      btn.textContent = 'Create account';
    });
  </script>
</head>
<body>
  <header class="l-head">
    <a class="l-brand" href="/" aria-label="MetaPlay home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="logo-body" d="M5.8 2.5H16.4L19 5.1V21.2L12 16.6L5 21.2V3.3C5 2.9 5.4 2.5 5.8 2.5Z"/><rect class="logo-label" x="7.6" y="5.4" width="8.8" height="6.2" rx="0.7"/><rect class="logo-grip" x="7.6" y="13" width="8.8" height="0.9"/></svg>
      <span>MetaPlay</span>
    </a>
    <nav class="l-nav" aria-label="Account"><a class="l-link" href="/pages/login.html">Sign in</a></nav>
  </header>
  <main class="a-main">
    <div class="a-card">
      <h1>Start your shelf</h1>
      <p class="a-sub">Free, and it takes about thirty seconds.</p>
      <form class="a-form" id="form" novalidate>
        <label class="a-field">Username
          <input name="username" autocomplete="username" maxlength="50" required autofocus>
        </label>
        <label class="a-field">Email
          <input name="email" type="email" autocomplete="email" maxlength="100" required>
        </label>
        <label class="a-field">Password <span class="a-hint">At least 8 characters</span>
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="a-field">Bio <span class="a-hint">Optional</span>
          <textarea name="bio" rows="3" maxlength="500" placeholder="What do you play?"></textarea>
        </label>
        <p class="a-msg" id="msg" role="alert"></p>
        <button type="submit" class="l-cta">Create account</button>
      </form>
      <div class="a-or">OR</div>
      <a class="l-google l-light" href="/auth/google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>
        Sign up with Google
      </a>
      <p class="a-alt">Already tracking? <a href="/pages/login.html">Sign in</a></p>
    </div>
  </main>
</body>
</html>
