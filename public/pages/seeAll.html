<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover · MetaPlay</title>
  <!-- Old "See all" links: map ?category= to a Discover scope. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var scope = { current: 'playing', wishlist: 'wishlist', completed: 'completed', trending: 'trending', comingSoon: 'soon' }[p.get('category')];
      location.replace('/pages/discover.html' + (scope ? '?scope=' + scope : ''));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/pages/discover.html">
</head>
<body>
  <p><a href="/pages/discover.html">Continue to Discover</a></p>
</body>
</html>
