<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script type="module" src="/js/game.js"></script>
</head>
<body data-page="game">
  <div id="game" aria-busy="true">
    <section class="g-hero" aria-label="Loading game">
      <div class="g-hero-in">
        <div class="g-head">
          <div class="g-title-block" style="width:min(640px,100%)">
            <div class="sk sk-line short"></div>
            <div class="sk" style="height:56px;margin:14px 0"></div>
            <div class="sk sk-line"></div>
          </div>
        </div>
        <div class="g-actions"><div class="sk" style="height:40px;width:340px;max-width:100%"></div></div>
      </div>
    </section>
  </div>
</body>
</html>
