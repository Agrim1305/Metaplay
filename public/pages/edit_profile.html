<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit profile · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script type="module" src="/js/editProfile.js"></script>
</head>
<body data-page="profile">
  <main class="page form-page">
    <div>
      <a class="g-back rv-back" href="/pages/profile.html"><span class="ms" aria-hidden="true">arrow_back</span>Profile</a>
      <h1 class="page-title" style="margin-top:16px">Edit profile</h1>
      <p class="page-sub">Change your username, password or bio. Leave a field blank to keep it.</p>
    </div>
    <form id="form" autocomplete="off" novalidate>
      <label class="field">Username
        <input class="input" id="username" name="username" autocomplete="username" maxlength="50">
      </label>
      <label class="field">New password
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Leave blank to keep your current password">
        <span class="field-hint">At least 8 characters.</span>
      </label>
      <label class="field">Bio
        <textarea class="input" id="bio" name="bio" rows="4" maxlength="500" placeholder="What do you play? What are you stuck on?"></textarea>
      </label>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="save">Save changes</button>
        <a class="btn btn-secondary" href="/pages/profile.html">Cancel</a>
      </div>
      <p class="form-msg" id="msg" role="status"></p>
    </form>
  </main>
</body>
</html>
