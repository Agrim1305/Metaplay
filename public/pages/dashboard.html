<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · MetaPlay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body data-page="home">
  <main class="page">
    <section class="sec" aria-labelledby="hello">
      <h1 id="hello" class="page-title">Welcome back</h1>
      <div class="stats" id="stats" aria-busy="true">
        <div class="stat"><div class="sk" style="height:30px;width:48px"></div><div class="sk sk-line" style="margin-top:10px"></div></div>
        <div class="stat"><div class="sk" style="height:30px;width:48px"></div><div class="sk sk-line" style="margin-top:10px"></div></div>
        <div class="stat"><div class="sk" style="height:30px;width:48px"></div><div class="sk sk-line" style="margin-top:10px"></div></div>
        <div class="stat"><div class="sk" style="height:30px;width:48px"></div><div class="sk sk-line" style="margin-top:10px"></div></div>
      </div>
    </section>

    <section class="sec" aria-labelledby="lib-h">
      <div class="lib-head">
        <div class="lib-head-l">
          <h2 id="lib-h">Your library</h2>
          <div class="tabs rail" role="tablist" aria-label="Shelves" id="shelf-tabs"></div>
        </div>
        <a id="view-all" href="/pages/discover.html?scope=playing">View all</a>
      </div>
      <div class="grid-cards" id="shelf" role="tabpanel" aria-labelledby="lib-h" aria-busy="true"></div>
    </section>

    <section class="sched" id="schedule" aria-labelledby="cal-h"></section>

    <section class="sec" aria-labelledby="trend-h">
      <div class="sec-head">
        <h2 id="trend-h">Trending this week</h2>
        <a href="/pages/discover.html?scope=trending">Browse all</a>
      </div>
      <div class="trend" id="trend" aria-busy="true"></div>
    </section>
  </main>
</body>
</html>
